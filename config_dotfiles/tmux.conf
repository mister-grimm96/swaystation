# Terminal and color
set -g default-terminal "tmux-256color"

# True-color
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",xterm*:extkeys"

set -s extended-keys on
set -g allow-passthrough on

# Retain xterm key handling.
set -g xterm-keys on
set -gw xterm-keys on

# Palette:
# Cream      #fff4d2
# Charcoal   #202020
# Gray       #484848
# Amber      #d8a657
# Sage       #83a598
# Beige      #a89984
# Red        #ea6962
# Green      #8ec07c
# Magenta    #d3869b
# Orange     #e78a4e

# Use Ctrl+A as the prefix.
set -g prefix C-a
unbind C-b
unbind M-s
bind C-a send-prefix

# Start windows and panes at index 1.
set -g base-index 1
set -g pane-base-index 1

# Do not wrap search results.
set -g wrap-search off

# Reload configuration.
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config Reloaded"

# Toggle mouse support.
set -g mouse off
bind m set-option -g mouse \; display-message "Mouse: #{?mouse,ON,OFF}"


# pane settings
unbind %
bind-key -n M-\\ split-window -h -c "#{pane_current_path}"

# Alt+-: split vertically (top/bottom).
unbind '"'
bind-key -n M-- split-window -v -c "#{pane_current_path}"

# Prefix+p: split vertically.
unbind p
bind p split-window -v -c "#{pane_current_path}"

bind -n C-M-j resize-pane -D 3
bind -n C-M-k resize-pane -U 3
bind -n C-M-l resize-pane -R 3
bind -n C-M-h resize-pane -L 3

bind -n M-m resize-pane -Z

bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Swap panes.
bind -n M-K swap-pane -U
bind -n M-J swap-pane -D

# Previous/next window.
bind -n M-p previous-window
bind -n M-n next-window

# Move windows left/right.
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

# Create a window in the current pane's working directory.
unbind n
bind n new-window -c "#{pane_current_path}"

# Toggle status bar.
bind-key -n M-s set-option -g status

# Enter copy mode.
bind-key -n M-y copy-mode

# Status bar
set -g status on
set -g status-position top
set -g status-interval 1
set -g status-justify left

# Overall bar.
set -g status-style "bg=#222222,fg=#fff4d2,bold"

# Session segment on the left.
set -g status-left-length 0
set -g status-left ""

# Space available to the window list.
set -g status-right-length 100

# Right side: current path and clock.
set -g status-right \
'#[fg=#000000,bg=#d8a657,bold] #S '

# Inactive windows.
set -g window-status-format \
'#[fg=#fff4d2,bg=#484848,bold] #I \
#[fg=#000000,bg=#a89984,bold] #W '

# Active window.
set -g window-status-current-format \
'#[fg=#000000,bg=#d8a657,bold] #I \
#[fg=#000000,bg=#83a598,bold] #W '

# Window separators.
set -g window-status-separator " "

# Avoid additional style settings overriding embedded colors.
set -g window-status-style "bg=#202020,fg=#fff4d2"
set -g window-status-current-style "bg=#202020,fg=#fff4d2"


# Message and command-prompt colors.
set -g message-style "bg=#d8a657,fg=#202020,bold"
set -g message-command-style "bg=#202020,fg=#d8a657,bold"

set -g pane-border-style "fg=#484848"
set -g pane-active-border-style "fg=#d8a657"
